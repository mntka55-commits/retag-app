    m.innerHTML=`<div class="section"><button class="back secondary small" onclick="show('models')">رجوع</button><h2>${esc(x.name)}</h2></div>
      <div class="card"><div class="grid3">
      <div class="metric"><span>🛠️ تجهيز</span><b>${num(x.inProgress)}</b></div>
      <div class="metric"><span>📦 جاهز</span><b>${num(x.ready)}</b></div>
      <div class="metric"><span>📋 مطلوب</span><b>${num(x.required)}</b></div></div></div>
      <div class="card"><div class="split"><div><div class="title">سعر البيع الرسمي</div>
      <div class="big">${num(x.price)>0?money(x.price):'غير محدد'}</div></div>
      <button class="secondary small" onclick="editModelPrice(${x.id})">تعديل السعر</button></div>
      <div class="actions"><button onclick="cutStart(${x.id})">✂️ ابدأ قصّة</button>
      <button class="secondary" onclick="production(${x.id})">🏭 تسجيل إنتاج</button></div></div>
      <div class="card"><div class="title">🧵 خامات وإكسسوارات الموديل</div>
      <div class="inlineadd"><div><select id="recipeMat">${db.materials.map(z=>`<option value="${z.id}">${esc(z.name)} ${z.color?'— '+esc(z.color):''}</option>`).join('')}</select></div>
      <button onclick="recipeAdd(${x.id})">+ إضافة</button></div>
      ${x.recipe.map(r=>`<div class="item"><span>${esc(db.materials.find(z=>z.id===r.materialId)?.name||'')}</span><b>${r.qty} / قطعة</b></div>`).join('')}</div>
      <div class="card"><div class="title">✂️ سجل القصّات</div>${cutHtml}</div>
      <div class="card"><div class="title">📝 ملاحظات</div><div class="muted">${esc(x.note||'لا توجد ملاحظات')}</div></div>`;
  };

  window.sale=function(){
    const cs=db.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
    const ms=db.models.map(x=>`<option value="${x.id}" data-ready="${num(x.ready)}" data-price="${num(x.price)}">${esc(x.name)}</option>`).join('');
    if(!cs)return alert('أضف عميلًا أولًا قبل إصدار الفاتورة');
    if(!ms)return alert('أضف موديلًا أولًا قبل إصدار الفاتورة');
    modal('🧾 فاتورة',
      `<div class="field"><label>العميل</label><div class="inlineadd"><div><select id="s_customer">${cs}</select></div><button class="secondary" onclick="closeModal();add('customer')">+ عميل</button></div></div>
      <div class="field"><label>الموديل</label><select id="s_model" onchange="invoiceLive()">${ms}</select></div>
      <div class="grid3"><div class="metric"><span>الجاهز</span><b id="s_ready">0</b></div>
      <div class="metric"><span>السعر الرسمي</span><b id="s_official">غير محدد</b></div>
      <div class="metric"><span>الإجمالي</span><b id="s_total">0 ج</b></div></div>
      <div class="field"><label>سعر البيع في الفاتورة</label><input id="s_unitPrice" type="number" min="0.01" step="0.01" placeholder="اكتب السعر لو الموديل غير متسعر" oninput="invoiceLive()"></div>
      <div class="field"><label>الكمية</label><input id="s_qty" type="number" min="1" value="1" oninput="invoiceLive()"></div>
      <div id="s_price_hint" class="muted"></div><div id="s_warn" class="red"></div>
      <button style="width:100%" onclick="saveSale()">حفظ الفاتورة</button>`);
    invoiceLive();
  };

  window.invoiceLive=function(){
    const o=document.getElementById('s_model')?.options[document.getElementById('s_model')?.selectedIndex];
    const ready=num(o?.dataset.ready),official=num(o?.dataset.price),q=Math.floor(num(document.getElementById('s_qty')?.value));
    const p=document.getElementById('s_unitPrice');
    if(p && document.activeElement!==p && !p.value && official>0)p.value=official;
    const unit=num(p?.value);
    const r=document.getElementById('s_ready'),off=document.getElementById('s_official'),tot=document.getElementById('s_total');
    if(r)r.textContent=ready;
    if(off)off.textContent=official>0?money(official):'غير محدد';
    if(tot)tot.textContent=money(q*unit);
    const hint=document.getElementById('s_price_hint');
    if(hint)hint.textContent=official>0?'السعر الرسمي ظاهر هنا. لو هتبيع بسعر مختلف، غيّر سعر الفاتورة فقط.':'الموديل لسه ملوش سعر رسمي — اكتب سعر البيع هنا عشان نكمل الفاتورة.';
    const warn=document.getElementById('s_warn');
    if(warn)warn.textContent=q>ready?'⚠️ الكمية أكبر من الجاهز المتاح':(q<=0?'⚠️ اكتب كمية صحيحة':'');
  };

  window.saveSale=function(){
    const x=db.models.find(z=>Number(z.id)===Number(document.getElementById('s_model')?.value));
    const q=Math.floor(num(document.getElementById('s_qty')?.value));
    const customerId=num(document.getElementById('s_customer')?.value);
    const unit=num(document.getElementById('s_unitPrice')?.value);
    if(!x||!customerId||q<=0)return alert('اختر العميل والموديل والكمية');
    if(q>x.ready)return alert('لا يمكن بيع أكثر من الجاهز');
    if(unit<=0)return alert('اكتب سعر البيع للقطعة');
    const total=q*unit;
    x.ready-=q;x.sold=num(x.sold)+q;
    x.required=Math.max(0,num(x.required)-q);
    db.sales.push({id:Date.now(),customerId,modelId:x.id,qty:q,unitPrice:unit,total,officialPriceAtSale:num(x.price),date:new Date().toISOString()});
    save();closeModal();toast('تم حفظ الفاتورة');render();
  };
})();

</script>


<script>

/* RETAG V21 — internal QA guard; no new workflow.
   Keeps the tested business rules coherent when old/demo localStorage data is opened.
*/
(function(){
  const arr=['suppliers','materials','customers','models','purchases','cuts','sales','payments','supplierPayments','returns','expenses','requests'];
  arr.forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});

  db.models.forEach(m=>{
    ['price','ready','inProgress','required','produced','sold','returned'].forEach(k=>m[k]=Number(m[k])||0);
    if(!Array.isArray(m.recipe))m.recipe=[];
  });

  db.materials.forEach(m=>{
    m.stock=Number(m.stock)||0;
    m.threshold=Number(m.threshold)||0;
  });

  db.cuts.forEach(c=>{
    c.fabricQty=Number(c.fabricQty)||0;
    c.pieces=Number(c.pieces)||0;
    c.piecesProduced=Number(c.piecesProduced)||c.pieces;
    c.piecesReady=Number(c.piecesReady)||0;
    c.piecesInProgress=Number(c.piecesInProgress)||0;
    if(!Array.isArray(c.materials) && c.materialId!=null)
      c.materials=[{materialId:Number(c.materialId),qty:Number(c.fabricQty)||0}];

    // A cut that has only started must never contribute pieces.
    if(c.status==='جاري القص'){
      c.pieces=0;c.piecesProduced=0;c.piecesReady=0;c.piecesInProgress=0;
    }

    // If a completed cut has an output count, derive its actual per-piece usage.
    if(c.status==='جاري التجهيز' && c.piecesProduced>0)
      c.actualMetersPerPiece=c.fabricQty/c.piecesProduced;
  });
  save();
})();

</script>








<script>

/* RETAG V26 — return accounting fix
   Return is linked to a specific invoice and uses that invoice's sale price.
   Customer balance = sales - payments - returns.
*/
(function(){
  const N2=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
  const escV=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const moneyV=v=>typeof money==='function'?money(N2(v)):N2(v).toLocaleString('ar-EG')+' ج';

  function saleUnit(s){
    return N2(s.unitPrice) || (N2(s.qty)>0 ? N2(s.total)/N2(s.qty) : 0);
  }
  function returnValue(r){
    if(N2(r.total)>0) return N2(r.total);
    const s=(db.sales||[]).find(x=>Number(x.id)===Number(r.saleId));
    return s ? N2(r.qty)*saleUnit(s) : 0;
  }
  window.retagReturnValue=returnValue;

  window.retagCustomerBalance=function(id){
    const sold=(db.sales||[]).filter(s=>Number(s.customerId)===Number(id))
      .reduce((a,s)=>a+N2(s.total),0);
    const paid=(db.payments||[]).filter(p=>Number(p.customerId)===Number(id))
      .reduce((a,p)=>a+N2(p.amount),0);
    const returned=(db.returns||[]).filter(r=>Number(r.customerId)===Number(id))
      .reduce((a,r)=>a+returnValue(r),0);
    return sold-paid-returned;
  };

  // Replace the return dialog with invoice-linked selection.
  window.ret=function(){
    const cs=(db.customers||[]).map(c=>`<option value="${c.id}">${escV(c.name)}</option>`).join('');
    modal('↩️ مرتجع',
      `<div class="field"><label>العميل</label><select id="r_customer" onchange="retagRefreshReturnInvoices()">${cs}</select></div>
       <div class="field"><label>الفاتورة الأصلية</label><select id="r_sale" onchange="retagRefreshReturnInvoices()"></select></div>
       <div class="grid3"><div class="metric"><span>سعر القطعة بالفاتورة</span><b id="r_unit">0</b></div>
       <div class="metric"><span>مباع بالفاتورة</span><b id="r_saleqty">0</b></div>
       <div class="metric"><span>قيمة المرتجع</span><b id="r_total">0</b></div></div>
       <div class="field"><label>الكمية المرتجعة</label><input id="r_qty" type="number" min="1" value="1" oninput="retagRefreshReturnInvoices()"></div>
       <div id="r_warn" class="red"></div>
       <button style="width:100%" onclick="saveReturn()">حفظ المرتجع</button>`);
    retagRefreshReturnInvoices();
  };

  window.retagRefreshReturnInvoices=function(){
    const cid=N2(document.getElementById('r_customer')?.value);
    const sel=document.getElementById('r_sale');
    if(!sel)return;
    const sales=(db.sales||[]).filter(s=>Number(s.customerId)===cid);
    const current=sel.value;
    sel.innerHTML=sales.slice().reverse().map(s=>{
      const m=(db.models||[]).find(x=>Number(x.id)===Number(s.modelId));
      return `<option value="${s.id}">فاتورة #${s.id} — ${escV(m?.name||'موديل')} — ${N2(s.qty)} قطعة — ${moneyV(s.total)}</option>`;
    }).join('');
    if(current && [...sel.options].some(o=>o.value===current)) sel.value=current;
    const sale=sales.find(s=>Number(s.id)===Number(sel.value));
    const q=N2(document.getElementById('r_qty')?.value);
    const unit=sale?saleUnit(sale):0;
    const alreadyReturned=(db.returns||[]).filter(r=>Number(r.saleId)===Number(sale?.id))
      .reduce((a,r)=>a+N2(r.qty),0);
    const available=sale?Math.max(0,N2(sale.qty)-alreadyReturned):0;
    const total=q*unit;
    if(document.getElementById('r_unit'))document.getElementById('r_unit').textContent=moneyV(unit);
    if(document.getElementById('r_saleqty'))document.getElementById('r_saleqty').textContent=available;
    if(document.getElementById('r_total'))document.getElementById('r_total').textContent=moneyV(total);
    if(document.getElementById('r_warn'))document.getElementById('r_warn').textContent=q>available?'⚠️ كمية المرتجع أكبر من المتبقي من الفاتورة':'';
  };

  window.saveReturn=function(){
    const cid=N2(document.getElementById('r_customer')?.value);
    const sid=N2(document.getElementById('r_sale')?.value);
    const q=N2(document.getElementById('r_qty')?.value);
    const sale=(db.sales||[]).find(s=>Number(s.id)===sid);
    const model=sale&&(db.models||[]).find(x=>Number(x.id)===Number(sale.modelId));
    if(!cid||!sale||!model||q<=0)return alert('اختر العميل والفاتورة وأدخل الكمية');
    const already=(db.returns||[]).filter(r=>Number(r.saleId)===sid).reduce((a,r)=>a+N2(r.qty),0);
    if(q>N2(sale.qty)-already)return alert('الكمية أكبر من المتبقي من الفاتورة');
    const unit=saleUnit(sale), total=q*unit;
    model.ready=N2(model.ready)+q;
    model.sold=Math.max(0,N2(model.sold)-q);
    model.returned=N2(model.returned)+q;
    db.returns.push({
      id:Date.now(), customerId:cid, modelId:model.id, saleId:sid,
      qty:q, unitPrice:unit, total:total, date:new Date().toISOString()
    });
    save(); closeModal();
    toast(`تم تسجيل المرتجع — ${moneyV(total)} خُصمت من حساب العميل`);
    if(typeof render==='function')render();
  };

  // Override the existing customer balance/detail screens so returns are included.
  window.customerBalance=function(id){return window.retagCustomerBalance(id);};

  window.customerDetail=function(id){
    const c=(db.customers||[]).find(z=>Number(z.id)===Number(id));
    if(!c){show('customers');return;}
    const sales=(db.sales||[]).filter(s=>Number(s.customerId)===Number(id));
    const pays=(db.payments||[]).filter(p=>Number(p.customerId)===Number(id));
    const rets=(db.returns||[]).filter(r=>Number(r.customerId)===Number(id));
    const sold=sales.reduce((a,s)=>a+N2(s.total),0);
    const paid=pays.reduce((a,p)=>a+N2(p.amount),0);
    const returned=rets.reduce((a,r)=>a+returnValue(r),0);
    const balance=sold-paid-returned;
    const inv=sales.slice().reverse().map(s=>{
      const mo=(db.models||[]).find(z=>Number(z.id)===Number(s.modelId));
      return `<div class="item"><div><b>فاتورة #${s.id}</b><div class="muted">${escV(mo?.name||'موديل')} — ${N2(s.qty)} قطعة × ${moneyV(saleUnit(s))}</div></div><b>${moneyV(s.total)}</b></div>`;
    }).join('')||'<div class="empty">لا توجد فواتير</div>';
    const ph=pays.slice().reverse().map(p=>`<div class="item"><div><b>دفعة</b><div class="muted">${new Date(p.date||Date.now()).toLocaleDateString('ar-EG')}</div></div><b class="green">+${moneyV(p.amount)}</b></div>`).join('')||'<div class="empty">لا توجد دفعات</div>';
    const rh=rets.slice().reverse().map(r=>`<div class="item"><div><b>↩️ مرتجع</b><div class="muted">فاتورة #${r.saleId||'—'} — ${N2(r.qty)} قطعة</div></div><b class="red">-${moneyV(returnValue(r))}</b></div>`).join('')||'<div class="empty">لا توجد مرتجعات</div>';
    document.getElementById('main').innerHTML=
      `<div class="section"><button class="back secondary small" onclick="show('customers')">رجوع</button><h2>${escV(c.name)}</h2></div>
       <div class="card"><div class="grid3"><div class="metric"><span>ليا</span><b>${moneyV(balance)}</b></div><div class="metric"><span>المبيعات</span><b>${moneyV(sold)}</b></div><div class="metric"><span>الدفعات</span><b>${moneyV(paid)}</b></div></div>
       <div class="grid3"><div class="metric"><span>قيمة المرتجعات</span><b>${moneyV(returned)}</b></div><div class="metric"><span>صافي المديونية</span><b>${moneyV(balance)}</b></div></div>
       <div class="actions"><button onclick="customerPay(${c.id})">💵 تسجيل دفعة</button></div></div>
       <div class="card"><div class="title">🧾 الفواتير</div>${inv}</div>
       <div class="card"><div class="title">💵 دفعات العملاء</div>${ph}</div>
       <div class="card"><div class="title">↩️ المرتجعات</div>${rh}</div>`;
  };
})();

</script>


<script>

/* RETAG V27 — customer return accounting + accounts screen fix */
(function(){
  const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
  const retVal=r=>{
    if(num(r.total)>0)return num(r.total);
    if(num(r.amount)>0)return num(r.amount);
    const s=(db.sales||[]).find(x=>Number(x.id)===Number(r.saleId));
    if(!s)return 0;
    const unit=num(s.unitPrice)||(num(s.qty)?num(s.total)/num(s.qty):0);
    return num(r.qty)*unit;
  };
  const customerRet=id=>(db.returns||[])
    .filter(r=>Number(r.customerId)===Number(id))
    .reduce((a,r)=>a+retVal(r),0);
  const customerSold=id=>(db.sales||[])
    .filter(s=>Number(s.customerId)===Number(id))
    .reduce((a,s)=>a+num(s.total),0);
  const customerPaid=id=>(db.payments||[])
    .filter(p=>Number(p.customerId)===Number(id))
    .reduce((a,p)=>a+num(p.amount),0);

  window.retagCustomerBalance=function(id){
    return customerSold(id)-customerPaid(id)-customerRet(id);
  };

  /* Customers list: show net receivable after returns. */
  window.customers=function(m){
    const rows=(db.customers||[]).map(c=>{
      const sold=customerSold(c.id), paid=customerPaid(c.id), returned=customerRet(c.id);
      const bal=sold-paid-returned;
      return `<div class="card" onclick="customerDetail(${c.id})">
        <div class="split"><div class="title">${typeof esc==='function'?esc(c.name):c.name}</div><b>${money(bal)}</b></div>
        <div class="muted">مبيعات ${money(sold)} — دفعات ${money(paid)} — مرتجعات ${money(returned)}</div>
        <div class="actions"><button class="secondary small" onclick="event.stopPropagation();customerPay(${c.id})">+ دفعة</button></div>
      </div>`;
    }).join('')||'<div class="card empty">أضف أول عميل</div>';
    m.innerHTML=`<div class="section"><h2>👥 العملاء</h2><button onclick="add('customer')" class="small">+ إضافة عميل</button></div>${rows}`;
  };

  /* Accounts: receivables must be net of customer returns. */
  window.accounts=function(m){
    const sales=(db.sales||[]).reduce((a,s)=>a+num(s.total),0);
    const payments=(db.payments||[]).reduce((a,p)=>a+num(p.amount),0);
    const returns=(db.returns||[]).reduce((a,r)=>a+retVal(r),0);
    const supplierDue=(db.purchases||[]).reduce((a,p)=>a+num(p.total),0)
      -(db.supplierPayments||[]).reduce((a,p)=>a+num(p.amount),0);
    const expenses=(db.expenses||[]).reduce((a,e)=>a+num(e.amount),0);
    m.innerHTML=`
      <div class="section"><h2>💰 الحسابات</h2></div>
      <div class="grid">
        <div class="card metric"><span>ليا — العملاء</span><b>${money(sales-payments-returns)}</b></div>
        <div class="card metric"><span>عليا — الموردين</span><b>${money(supplierDue)}</b></div>
        <div class="card metric"><span>المبيعات</span><b>${money(sales)}</b></div>
        <div class="card metric"><span>التحصيل</span><b>${money(payments)}</b></div>
        <div class="card metric"><span>مرتجعات العملاء</span><b>${money(returns)}</b></div>
        <div class="card metric"><span>مصروفات المصنع</span><b>${money(expenses)}</b></div>
      </div>
      <div class="card">
        <div class="title">📌 صافي مستحقات العملاء</div>
        <div class="big">${money(sales-payments-returns)}</div>
        <div class="muted">المبيعات − دفعات العملاء − قيمة المرتجعات</div>
      </div>
      <div class="card">
        <div class="title">🧾 المشتريات — مخزون</div>
        <div class="big">${money((db.purchases||[]).reduce((a,p)=>a+num(p.total),0))}</div>
        <div class="muted">المشتريات تدخل المخزون ولا تُحسب كمصروف تشغيل.</div>
        <button style="width:100%" onclick="show('purchaseHistory')">📋 عرض سجل المشتريات</button>
      </div>`;
  };

  /* Payment dialog must also use the corrected balance. */
  window.customerPay=function(id){
    const c=(db.customers||[]).find(x=>Number(x.id)===Number(id));
    if(!c)return;
    const bal=window.retagCustomerBalance(id);
    modal('💵 دفعة عميل — '+(typeof esc==='function'?esc(c.name):c.name),
      `<div class="card"><div class="muted">الرصيد الحالي (ليا)</div><div class="big">${money(bal)}</div></div>
       <div class="field"><label>مبلغ الدفعة</label><input id="cp_amt" type="number" min="0.01" step="0.01"></div>
       <button style="width:100%" onclick="saveCustomerPayment(${id})">حفظ الدفعة</button>`);
  };

  window.saveCustomerPayment=function(id){
    const amount=num(document.getElementById('cp_amt')?.value);
    const bal=window.retagCustomerBalance(id);
    if(amount<=0)return alert('اكتب مبلغ الدفعة');
    if(amount>bal)return alert('الدفعة أكبر من الرصيد المستحق');
    db.payments.push({id:Date.now(),customerId:Number(id),amount,date:new Date().toISOString()});
    save();closeModal();toast('تم تسجيل دفعة العميل');customerDetail(id);
  };
})();

</script>


<script>

/* RETAG V28 — purchase split (paid now / credit) + cash movement */
(function(){
  const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
  const esc3=s=>typeof esc==='function'?esc(s):String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money3=v=>typeof money==='function'?money(num(v)):num(v).toLocaleString('ar-EG')+' ج';
  const sum=(arr,key)=> (arr||[]).reduce((a,x)=>a+num(x[key]),0);
  const purchasePaid=p=>num(p.paidNow);
  const purchaseCredit=p=>Math.max(0,num(p.total)-purchasePaid(p));

  window.purchase=function(){
    const matOpts=(db.materials||[]).map(x=>`<option value="${x.id}">${esc3(x.name)} ${x.color?'— '+esc3(x.color):''} — المخزون ${num(x.stock)} ${esc3(x.unit||'')}</option>`).join('');
    const supOpts=(db.suppliers||[]).map(x=>`<option value="${x.id}">${esc3(x.name)}</option>`).join('');
    modal('🛒 شراء خامة',
      `<div class="field"><label>الصنف</label><div class="inlineadd"><div><select id="p_mat">${matOpts}</select></div><button class="secondary" onclick="quickAdd('material')">+ خامة</button></div></div>`+
      `<div class="formrow"><div class="field"><label>الكمية</label><input id="p_qty" type="number" min="0" step="0.01"></div>`+
      `<div class="field"><label>إجمالي الشراء</label><input id="p_total" type="number" min="0" step="0.01" oninput="purchaseDuePreview()"></div></div>`+
      `<div class="field"><label>المدفوع الآن</label><input id="p_paid" type="number" min="0" step="0.01" value="0" oninput="purchaseDuePreview()"></div>`+
      `<div class="card" style="margin:8px 0"><div class="split"><span>المتبقي آجل</span><b id="p_due_preview">0 ج</b></div><div class="muted">المدفوع الآن يخرج من النقدية، والمتبقي يصبح مستحقًا للمورد.</div></div>`+
      `<div class="field"><label>المورد</label><div class="inlineadd"><div><select id="p_sup">${supOpts}</select></div><button class="secondary" onclick="quickAdd('supplier')">+ مورد</button></div></div>`+
      `<button style="width:100%" onclick="savePurchase()">حفظ الشراء</button>`+
      `<div style="margin-top:8px"><button class="secondary" style="width:100%" onclick="closeModal();show('purchasesHistory')">🧾 سجل المشتريات</button></div>`
    );
    setTimeout(window.purchaseDuePreview,0);
  };

  window.purchaseDuePreview=function(){
    const total=num(document.getElementById('p_total')?.value);
    const paid=num(document.getElementById('p_paid')?.value);
    const el=document.getElementById('p_due_preview');
    if(el) el.textContent=money3(Math.max(0,total-paid));
  };

  window.savePurchase=function(){
    const matId=num(document.getElementById('p_mat')?.value);
    const supId=num(document.getElementById('p_sup')?.value);
    const mat=(db.materials||[]).find(x=>Number(x.id)===matId);
    const sup=(db.suppliers||[]).find(x=>Number(x.id)===supId);
    const qty=num(document.getElementById('p_qty')?.value);
    const total=num(document.getElementById('p_total')?.value);
    const paidNow=num(document.getElementById('p_paid')?.value);
    if(!mat||qty<=0)return alert('اختر خامة وأدخل الكمية');
    if(!sup)return alert('اختار المورد — الشراء لازم يرتبط بمورد');
    if(total<=0)return alert('اكتب إجمالي شراء صحيح');
    if(paidNow<0||paidNow>total)return alert('المدفوع الآن لا يمكن أن يكون أكبر من إجمالي الشراء');
    mat.stock=num(mat.stock)+qty;
    db.purchases.push({id:Date.now(),materialId:mat.id,qty,total,paidNow,supplierId:sup.id,date:new Date().toISOString()});
    save();closeModal();toast('تم الشراء — المخزون زاد، والمدفوع خرج من النقدية');render();
  };

  function supplierDue(id){
    const bought=(db.purchases||[]).filter(p=>Number(p.supplierId)===Number(id)).reduce((a,p)=>a+purchaseCredit(p),0);
    const paid=sum((db.supplierPayments||[]).filter(p=>Number(p.supplierId)===Number(id)),'amount');
    return Math.max(0,bought-paid);
  }

  window.saveSupplierPay=function(id){
    const amount=num(document.getElementById('sp_amt')?.value);
    const balance=supplierDue(id);
    if(amount<=0)return alert('اكتب المبلغ');
    if(amount>balance)return alert('دفعة المورد أكبر من المديونية الحالية');
    db.supplierPayments.push({id:Date.now(),supplierId:Number(id),amount,date:new Date().toISOString()});
    save();closeModal();toast('تم تسجيل دفعة المورد');render();
  };

  window.accounts=function(m){
    const sales=sum(db.sales,'total');
    const collections=sum(db.payments,'amount');
    const returns=(db.returns||[]).reduce((a,r)=>{
      if(num(r.total)>0)return a+num(r.total);
      if(num(r.amount)>0)return a+num(r.amount);
      const sale=(db.sales||[]).find(s=>Number(s.id)===Number(r.saleId));
      const qty=num(r.qty)||num(r.quantity); const unit=sale?(num(sale.unitPrice)||(qty?num(sale.total)/qty:0)):0;
      return a+qty*unit;
    },0);
    const purchases=sum(db.purchases,'total');
    const purchasePaidNow=(db.purchases||[]).reduce((a,p)=>a+purchasePaid(p),0);
    const supplierPayments=sum(db.supplierPayments,'amount');
    const expenses=sum(db.expenses,'amount');
    const supplierDue=Math.max(0,purchases-purchasePaidNow-supplierPayments);
    const netCash=collections-purchasePaidNow-supplierPayments-expenses;
    m.innerHTML=`
      <div class="section"><h2>💰 الحسابات</h2></div>
      <div class="grid">
        <div class="card metric"><span>ليا — العملاء</span><b>${money3(sales-collections-returns)}</b></div>
        <div class="card metric"><span>عليا — الموردين</span><b>${money3(supplierDue)}</b></div>
        <div class="card metric"><span>المبيعات</span><b>${money3(sales)}</b></div>
        <div class="card metric"><span>التحصيل</span><b>${money3(collections)}</b></div>
        <div class="card metric"><span>مرتجعات العملاء</span><b>${money3(returns)}</b></div>
        <div class="card metric"><span>مصروفات المصنع</span><b>${money3(expenses)}</b></div>
      </div>
      <div class="card">
        <div class="title">💵 صافي حركة النقدية</div>
        <div class="big">${money3(netCash)}</div>
        <div class="muted">منذ بداية التسجيل = تحصيل العملاء − المدفوع نقدًا في المشتريات − دفعات الموردين − المصروفات.</div>
      </div>
      <div class="grid">
        <div class="card metric"><span>المشتريات — مخزون</span><b>${money3(purchases)}</b></div>
        <div class="card metric"><span>المدفوع نقدًا في المشتريات</span><b>${money3(purchasePaidNow)}</b></div>
      </div>
      <div class="card">
        <div class="title">📌 صافي مستحقات العملاء</div>
        <div class="big">${money3(sales-collections-returns)}</div>
        <div class="muted">المبيعات − دفعات العملاء − قيمة المرتجعات</div>
      </div>
      <div class="card">
        <div class="title">🧾 المشتريات — مخزون</div>
        <div class="big">${money3(purchases)}</div>
        <div class="muted">المشتريات تدخل المخزون ولا تُحسب كمصروف تشغيل. كل شراء جديد يحدد المدفوع الآن والباقي آجل.</div>
        <button style="width:100%" onclick="show('purchaseHistory')">📋 عرض سجل المشتريات</button>
      </div>`;
  };
})();

</script>



<script>

/* RETAG V29 — costing + decision analytics (additive layer)
   IMPORTANT: This layer does not replace the existing purchase/sales/cut/return/finance logic.
   It adds cost snapshots and analysis on top of the working V28 flow.

   Cost rules:
   1) Variable cost = actual material consumed in each cut × material purchase cost at that time.
   2) Actual meters/material per piece = actual material input ÷ actual cut output.
   3) Fixed allocation = configurable per-piece factory/model costs (labor/overhead/etc.).
   4) Official selling price remains independent from cost.
   5) Historical cuts/sales keep their cost snapshot once available; older records are analyzed
      conservatively without rewriting their original operational data.
*/
(function(){
  const N=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
  const M=v=>typeof money==='function'?money(N(v)):N(v).toLocaleString('ar-EG')+' ج';
  const E=s=>typeof esc==='function'?esc(s):String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sum=(arr,fn)=> (arr||[]).reduce((a,x)=>a+N(fn?fn(x):x),0);
  const today=()=>new Date().toISOString();

  // ---------- Non-destructive normalization ----------
  (db.models||[]).forEach(x=>{
    if(!Array.isArray(x.fixedCosts)) x.fixedCosts=[];
    x.fixedCostPerPiece=N(x.fixedCostPerPiece);
  });
  (db.cuts||[]).forEach(c=>{
    if(Array.isArray(c.materials)) c.materials.forEach(a=>{a.qty=N(a.qty);a.materialId=N(a.materialId)});
  });

  // ---------- Purchase price history ----------
  function purchaseUnitCostAt(materialId, atDate){
    const t=atDate?new Date(atDate).getTime():Infinity;
    const ps=(db.purchases||[]).filter(p=>Number(p.materialId)===Number(materialId))
      .filter(p=>!p.date || new Date(p.date).getTime()<=t)
      .filter(p=>N(p.qty)>0 && N(p.total)>0)
      .sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));
    if(!ps.length) return 0;
    // Weighted-average purchase cost as the safest cost basis without inventory lots.
    const qty=sum(ps,p=>p.qty), total=sum(ps,p=>p.total);
    return qty>0?total/qty:0;
  }
  window.retagPurchaseUnitCostAt=purchaseUnitCostAt;

  // ---------- Fixed cost setup ----------
  function fixedCostTotalPerPiece(model){
    if(!model) return 0;
    if(Array.isArray(model.fixedCosts) && model.fixedCosts.length)
      return sum(model.fixedCosts,c=>c.perPiece);
    return N(model.fixedCostPerPiece);
  }
  window.retagFixedCostPerPiece=fixedCostTotalPerPiece;

  window.editModelFixedCosts=function(id){
    const x=(db.models||[]).find(z=>Number(z.id)===Number(id));
    if(!x)return;
    const rows=Array.isArray(x.fixedCosts)?x.fixedCosts:[];
    const body=rows.map((r,i)=>`<div class="field cost-row" data-i="${i}"><label>بند التكلفة</label><input class="fc-name" value="${E(r.name||'')}" placeholder="عمالة / كهرباء / إيجار / أخرى"><label style="margin-top:6px">تكلفة البند للقطعة</label><input class="fc-val" type="number" min="0" step="0.01" value="${N(r.perPiece)}"></div>`).join('');
    modal('⚙️ التكاليف الثابتة للقطعة',
      `<div class="muted">دي تكلفة تقديرية تُحمّل على القطعة لأغراض حساب تكلفة الموديل والربحية. المصروفات الفعلية تظل في شاشة المصروفات منفصلة.</div>
       <div id="fixedCostRows">${body||'<div class="empty">لم تتم إضافة بنود بعد.</div>'}</div>
       <button class="secondary" style="width:100%;margin-top:8px" onclick="retagAddFixedCostRow()">+ بند تكلفة</button>
       <div class="card" style="margin-top:10px"><div class="split"><span>إجمالي الثابت/قطعة</span><b id="fixedCostPreview">${M(fixedCostTotalPerPiece(x))}</b></div></div>
       <button style="width:100%" onclick="saveModelFixedCosts(${id})">حفظ التكاليف</button>`);
    setTimeout(()=>retagRefreshFixedCostPreview(),0);
  };
  window.retagAddFixedCostRow=function(){
    const wrap=document.getElementById('fixedCostRows');
    if(!wrap)return;
    if(wrap.querySelector('.empty'))wrap.innerHTML='';
    wrap.insertAdjacentHTML('beforeend',`<div class="field cost-row"><label>بند التكلفة</label><input class="fc-name" placeholder="عمالة / كهرباء / إيجار / أخرى"><label style="margin-top:6px">تكلفة البند للقطعة</label><input class="fc-val" type="number" min="0" step="0.01" value="0"></div>`);
    retagRefreshFixedCostPreview();
  };
  window.retagRefreshFixedCostPreview=function(){
    const total=[...document.querySelectorAll('#fixedCostRows .fc-val')].reduce((a,e)=>a+N(e.value),0);
    const el=document.getElementById('fixedCostPreview');if(el)el.textContent=M(total);
  };
  window.saveModelFixedCosts=function(id){
    const x=(db.models||[]).find(z=>Number(z.id)===Number(id));if(!x)return;
    const rows=[...document.querySelectorAll('#fixedCostRows .cost-row')].map(r=>({
      name:r.querySelector('.fc-name')?.value?.trim()||'تكلفة أخرى',
      perPiece:N(r.querySelector('.fc-val')?.value)
    })).filter(r=>r.perPiece>0);
    x.fixedCosts=rows;
    x.fixedCostPerPiece=sum(rows,r=>r.perPiece);
    x.fixedCostUpdatedAt=today();
    save();closeModal();toast('تم حفظ التكاليف الثابتة للموديل');render();
  };

  // ---------- Cut costing ----------
  function cutMaterials(c){
    return Array.isArray(c?.materials)&&c.materials.length
      ? c.materials.map(a=>({materialId:N(a.materialId),qty:N(a.qty)})).filter(a=>a.materialId&&a.qty>0)
      : (c&&N(c.materialId)&&N(c.fabricQty)>0?[{materialId:N(c.materialId),qty:N(c.fabricQty)}]:[]);
  }

  function buildCutCostSnapshot(c){
    const at=c?.start||c?.end||today();
    const mats=cutMaterials(c);
    const items=mats.map(a=>{
      const m=(db.materials||[]).find(x=>Number(x.id)===Number(a.materialId));
      const unitCost=purchaseUnitCostAt(a.materialId,at);
      return {materialId:a.materialId,materialName:m?.name||'خامة',color:m?.color||'',qty:a.qty,unitCost,total:a.qty*unitCost,unit:m?.unit||'وحدة'};
    });
    const variableCost=sum(items,i=>i.total);
    const pieces=N(c?.piecesProduced||c?.pieces);
    const variablePerPiece=pieces>0?variableCost/pieces:0;
    return {at,items,variableCost,pieces,variablePerPiece,method:'weighted_average_purchase_price'};
  }

  function ensureCutSnapshot(c){
    if(c.costSnapshot && Array.isArray(c.costSnapshot.items)) return c.costSnapshot;
    return buildCutCostSnapshot(c);
  }
  window.retagCutCost=ensureCutSnapshot;

  // ---------- Model-level production cost analysis ----------
  function modelCostStats(modelId){
    const x=(db.models||[]).find(z=>Number(z.id)===Number(modelId));
    if(!x)return null;
    const cuts=(db.cuts||[]).filter(c=>Number(c.modelId)===Number(modelId));
    let produced=0, variableCost=0, materialTotals={};
    cuts.forEach(c=>{
      const snap=ensureCutSnapshot(c);
      produced+=N(snap.pieces);
      variableCost+=N(snap.variableCost);
      (snap.items||[]).forEach(i=>{
        const key=String(i.materialId);
        if(!materialTotals[key])materialTotals[key]={materialId:i.materialId,name:i.materialName,color:i.color,unit:i.unit,qty:0,cost:0};
        materialTotals[key].qty+=N(i.qty);
        materialTotals[key].cost+=N(i.total);
      });
    });
    // Use the fixed-cost snapshot stored on each cut. This prevents a later change
    // to the model's fixed-cost setup from rewriting historical production cost.
    let fixedCost=0, fixedAllocatedPieces=0;
    cuts.forEach(c=>{
      const pieces=N(c?.piecesProduced||c?.pieces);
      const f=N(c?.fixedCostPerPieceAtCut);
      if(pieces>0 && f>0){ fixedCost += pieces*f; fixedAllocatedPieces += pieces; }
    });
    const fixedPerPiece=produced>0
      ? (fixedCost>0 ? fixedCost/produced : fixedCostTotalPerPiece(x))
      : fixedCostTotalPerPiece(x);
    if(fixedCost===0 && produced>0) fixedCost=produced*fixedPerPiece;
    const totalProductionCost=variableCost+fixedCost;
    const costPerProduced=produced>0?totalProductionCost/produced:0;
    const soldQty=N(x.sold), returnedQty=N(x.returned);
    const netSoldQty=Math.max(0,soldQty-returnedQty);
    const sales=(db.sales||[]).filter(s=>Number(s.modelId)===Number(modelId));
    const returns=(db.returns||[]).filter(r=>Number(r.modelId)===Number(modelId));
    const revenue=sum(sales,s=>s.total)-sum(returns,r=>returnValue(r));
    const cogs=Math.min(netSoldQty,produced)*costPerProduced;
    const profit=revenue-cogs;
    const avgMaterialPerPiece={};
    Object.values(materialTotals).forEach(i=>{avgMaterialPerPiece[i.materialId]=produced>0?i.qty/produced:0;});
    return {model:x,produced,variableCost,fixedPerPiece,fixedCost,totalProductionCost,costPerProduced,soldQty,returnedQty,netSoldQty,revenue,cogs,profit,materialTotals:Object.values(materialTotals),avgMaterialPerPiece};
  }
  window.retagModelCostStats=modelCostStats;

  function saleUnitPrice(s){return N(s.unitPrice)||(N(s.qty)>0?N(s.total)/N(s.qty):0)}
  function returnValue(r){
    if(N(r.total)>0)return N(r.total);
    const s=(db.sales||[]).find(x=>Number(x.id)===Number(r.saleId));
    return s?N(r.qty)*saleUnitPrice(s):0;
  }

  // ---------- Average actual consumption ----------
  function modelMaterialRows(stats){
    return (stats?.materialTotals||[]).map(i=>{
      const avg=stats.produced>0?i.qty/stats.produced:0;
      const unitCost=i.cost>0&&i.qty>0?i.cost/i.qty:0;
      return {name:i.name,color:i.color,unit:i.unit,totalQty:i.qty,avgPerPiece:avg,unitCost,totalCost:i.cost};
    });
  }

  // ---------- Non-destructive sale cost snapshot for NEW sales ----------
  const oldSaveSale=window.saveSale;
  const oldSaveCutFinish=window.saveCutFinish;
  if(typeof oldSaveSale==='function'){
    window.saveSale=function(){
      const modelId=N(document.getElementById('s_model')?.value);
      const before=(db.sales||[]).length;
      oldSaveSale();
      if((db.sales||[]).length>before){
        const s=db.sales[db.sales.length-1];
        if(!s.costPerPiece){
          const stats=modelCostStats(modelId);
          s.costPerPiece=stats?.costPerProduced||0;
          s.costTotal=N(s.qty)*N(s.costPerPiece);
          s.costSnapshotDate=today();
          save();
        }
      }
    };
  }

  // Snapshot cost inputs when a NEW cut is finished. Existing operational logic runs first,
  // then we only add metadata; no stock/production/accounting numbers are changed here.
  if(typeof oldSaveCutFinish==='function'){
    window.saveCutFinish=function(cutId){
      const before=(db.cuts||[]).find(c=>Number(c.id)===Number(cutId));
      oldSaveCutFinish(cutId);
      const c=(db.cuts||[]).find(x=>Number(x.id)===Number(cutId));
      if(c && c.piecesProduced>0 && !c.costSnapshot){
        c.costSnapshot=buildCutCostSnapshot(c);
        const model=(db.models||[]).find(x=>Number(x.id)===Number(c.modelId));
        c.fixedCostPerPieceAtCut=fixedCostTotalPerPiece(model);
        c.costSnapshot.fixedCostPerPieceAtCut=c.fixedCostPerPieceAtCut;
        c.costSnapshot.totalCost=c.costSnapshot.variableCost + c.piecesProduced*c.fixedCostPerPieceAtCut;
        c.costSnapshot.costPerPiece=c.piecesProduced>0?c.costSnapshot.totalCost/c.piecesProduced:0;
        c.costSnapshotDate=today();
        save();
      }
    };
  }

  // ---------- Model detail: keep V28 flow, add analysis below it ----------
  const oldModelDetail=window.modelDetail;
  window.modelDetail=function(m){
    oldModelDetail(m);
    const x=(db.models||[]).find(z=>Number(z.id)===Number(activeModel));
    if(!x)return;
    const stats=modelCostStats(x.id);
    const existing=m.innerHTML;
    const materialRows=modelMaterialRows(stats);
    const cutRows=(db.cuts||[]).filter(c=>Number(c.modelId)===Number(x.id)).slice().reverse().map(c=>{
      const snap=ensureCutSnapshot(c);
      const pieces=N(snap.pieces), varCost=N(snap.variableCost), varPP=N(snap.variablePerPiece);
      return `<div class="item"><div><b>قصّة #${c.id}</b><div class="muted">${pieces} قطعة — خامات ${M(varCost)}</div></div><b>${pieces?M(varPP)+'/قطعة':'—'}</b></div>`;
    }).join('')||'<div class="empty">لا توجد قصّات حتى الآن</div>';
    const materialHtml=materialRows.map(r=>`<div class="item"><div><b>${E(r.name)}${r.color?' — '+E(r.color):''}</b><div class="muted">إجمالي ${N(r.totalQty)} ${E(r.unit)} — متوسط ${N(r.avgPerPiece).toFixed(3)} ${E(r.unit)}/قطعة</div></div><b>${M(r.unitCost)} / ${E(r.unit)}</b></div>`).join('')||'<div class="empty">لا توجد بيانات استهلاك فعلية بعد</div>';
    const analysis=`
      <div class="section"><h2>📊 تحليل التكلفة والبيانات</h2></div>
      <div class="card">
        <div class="grid3">
          <div class="metric"><span>إجمالي الإنتاج</span><b>${N(stats.produced)}</b></div>
          <div class="metric"><span>إجمالي التكلفة</span><b>${M(stats.totalProductionCost)}</b></div>
          <div class="metric"><span>تكلفة القطعة</span><b>${M(stats.costPerProduced)}</b></div>
          <div class="metric"><span>المباع</span><b>${N(stats.soldQty)}</b></div>
          <div class="metric"><span>المرتجع</span><b>${N(stats.returnedQty)}</b></div>
          <div class="metric"><span>صافي المبيعات</span><b>${M(stats.revenue)}</b></div>
        </div>
      </div>
      <div class="card">
        <div class="split"><div><div class="title">⚙️ التكلفة الثابتة/قطعة</div><div class="big">${M(stats.fixedPerPiece)}</div></div><button class="secondary small" onclick="editModelFixedCosts(${x.id})">تعديل</button></div>

  };

  // Put a clear analysis button into the current model page, without altering its existing actions.
  const oldModelDetail2=window.modelDetail;

    const x=(db.models||[]).find(z=>Number(z.id)===Number(activeModel));if(!x)return;

      m.appendChild(block);

  // Persist only the harmless normalization fields once.
  save();
})();

<script>
/* RETAG V40 — STRUCTURAL CLEANUP + COMPLETED CUT FIX
   Purpose: one clean binding for completed cuts and a documented audit of the
   accumulated prototype layers. Business formulas are preserved unless listed
   as a confirmed structural defect.
*/
(function(){
  const N=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
  const arr=k=>Array.isArray(db[k])?db[k]:[];

  // Developer audit trail: visible from the console, not part of user data.
  window.RETAG_AUDIT_LOG={
    version:'V40',
    cleaned:[
      'Removed two obsolete scripts with JavaScript syntax errors (V24/V25 layers).',
      'Removed accumulated V34/V35/V37/V38/V39 completed-cut click binders.',
      'Kept supplier detail, supplier balance, cancellation, normalization and read-only cut data logic.',
      'Established one final completed-cut click target after the final model renderer.',
      'Completed cut is read-only: no action buttons and no accounting/stock mutation.'
    ],
    verifiedRules:[
      'Supplier due = purchases - paid at purchase - later supplier payments.',
      'Customer receivable = active sales - valid customer payments - return value.',
      'Net cash = collections - purchase-time cash - later supplier payments - expenses - cash refunds.',
      'Material purchases increase stock and are not operating expenses.',
      'Return value uses the original sale price and also returns quantity to ready stock.',
      'Invoice cancellation reverses stock/sales effects; canceled invoice quantity does not restore customer demand.',
      'Cut start deducts actual material immediately; piece count is entered only at cut finish.',
      'Actual material consumption per piece = actual material input / actual pieces produced.',
      'Official model price is independent from invoice-specific price.',
      'Accessory cost is manually fixed per piece until the owner changes it.'
    ],
    reviewedButDeferred:[
      'Multi-model invoice: current prototype stores one model per sales record; implementing multiple models in one invoice requires an invoice-header/line-item decision so payments, returns and cancellation remain unambiguous.',
      'Material cost basis: current analytics uses weighted-average purchase cost up to cut date because inventory lots are not implemented; this is an accounting-method choice, not silently changed in V40.'
    ]
  };

  function findCompletedCutCard(card, modelId){
    const tag=[...card.querySelectorAll(':scope > .split .tag')].find(t=>(t.textContent||'').trim()==='مكتملة');
    if(!tag)return null;
    const title=card.querySelector(':scope > .split b');
    const txt=(title?.textContent||card.textContent||'');
    const mm=txt.match(/قصّة\s*رقم\s*(\d+)/);
    const seq=mm?Number(mm[1]):0;
    const cuts=arr('cuts').filter(c=>Number(c.modelId)===Number(modelId)&&c.status==='مكتملة');
    if(seq>0){
      const bySeq=cuts.find(c=>N(c.sequence||c.cutNo)===seq);
      if(bySeq)return bySeq;
    }
    const idm=txt.match(/قصّة\s*#\s*(\d+)/);
    if(idm)return cuts.find(c=>N(c.id)===N(idm[1]))||null;
    return null;
  }

  function bindCompletedCutCardsFinal(){
    const main=document.getElementById('main');
    if(!main || typeof window.cutReadOnly!=='function')return;
    const modelId=N(window.activeModel);
    if(!modelId)return;
    main.querySelectorAll('.card').forEach(card=>{
      const cut=findCompletedCutCard(card,modelId);
      if(!cut)return;
      if(card.dataset.v40CompletedCutId===String(cut.id))return;
      card.dataset.v40CompletedCutId=String(cut.id);
      card.style.cursor='pointer';
      card.style.touchAction='manipulation';
      card.style.webkitUserSelect='none';
      card.style.userSelect='none';
      card.setAttribute('role','button');
      card.setAttribute('tabindex','0');
      card.title='عرض بيانات القصّة فقط';
      const actions=card.querySelector(':scope > .actions');
      if(actions)actions.innerHTML='<span class="muted">📋 عرض بيانات القصّة فقط</span>';
      card.onclick=function(e){
        if(e.target.closest?.('button,a,input,select,textarea'))return;
        e.preventDefault();e.stopPropagation();
        window.cutReadOnly(cut.id);
      };
      card.onkeydown=function(e){
        if((e.key==='Enter'||e.key===' ')&&!e.target.closest?.('button,a,input,select,textarea')){
          e.preventDefault();window.cutReadOnly(cut.id);
        }
      };
    });
  }

  // One wrapper only. No document-level touch listener and no duplicate modelDetail wrappers.
  const baseModelDetail=window.modelDetail;
  if(typeof baseModelDetail==='function'){
    window.modelDetail=function(m){
      baseModelDetail(m);
      bindCompletedCutCardsFinal();
      setTimeout(bindCompletedCutCardsFinal,0);
    };
  }
  const baseRender=window.render;
  if(typeof baseRender==='function'){
    window.render=function(){
      const r=baseRender.apply(this,arguments);
      setTimeout(bindCompletedCutCardsFinal,0);
      return r;
    };
  }
  window.retagBindCompletedCuts=bindCompletedCutCardsFinal;
})();
</script>

<script>

/* RETAG V31 — costing/master-price rules + cut UX/numbering + invoice cancellation
   Additive patch over V30. Existing tested workflows remain intact unless a sale is explicitly cancelled.

(function(){
  const N=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
  const E=s=>typeof esc==='function'?esc(s):String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const M=v=>typeof money==='function'?money(N(v)):N(v).toLocaleString('ar-EG')+' ج';

  window.purchase=function(){

      `<div class="field"><label>الصنف</label><div class="inlineadd"><div><select id="p_mat">${matOpts}</select></div><button class="secondary" onclick="quickAdd('material')">+ خامة</button></div></div>
       <div class="formrow"><div class="field"><label>الكمية</label><input id="p_qty" type="number" min="0.01" step="0.01" oninput="purchaseCalc()"></div>
       <div class="field"><label>سعر الوحدة</label><input id="p_unitPrice" type="number" min="0" step="0.01" oninput="purchaseCalc()"></div></div>
       <div class="card" style="margin:8px 0"><div class="split"><span>إجمالي الشراء</span><b id="p_total_preview">0 ج</b></div></div>
       <div class="field"><label>المدفوع الآن</label><input id="p_paid" type="number" min="0" step="0.01" value="0" oninput="purchaseCalc()"></div>
       <div class="card" style="margin:8px 0"><div class="split"><span>المتبقي آجل</span><b id="p_due_preview">0 ج</b></div><div class="muted">الشراء يزيد المخزون. المدفوع فقط يخرج من النقدية، والباقي يصبح مستحقًا للمورد.</div></div>
       <div class="field"><label>المورد</label><div class="inlineadd"><div><select id="p_sup">${supOpts}</select></div><button class="secondary" onclick="quickAdd('supplier')">+ مورد</button></div></div>
       <button style="width:100%" onclick="savePurchase()">حفظ الشراء</button>`);
    setTimeout(purchaseCalc,0);

  window.purchaseCalc=function(){
    const q=N(document.getElementById('p_qty')?.value), u=N(document.getElementById('p_unitPrice')?.value), paid=N(document.getElementById('p_paid')?.value);
    const total=q*u;
    const t=document.getElementById('p_total_preview'),d=document.getElementById('p_due_preview');
    if(t)t.textContent=M(total); if(d)d.textContent=M(Math.max(0,total-paid));
  };
  window.savePurchase=function(){
    const mat=(db.materials||[]).find(x=>Number(x.id)===N(document.getElementById('p_mat')?.value));
    const sup=(db.suppliers||[]).find(x=>Number(x.id)===N(document.getElementById('p_sup')?.value));
    const qty=N(document.getElementById('p_qty')?.value), unitPrice=N(document.getElementById('p_unitPrice')?.value), total=qty*unitPrice, paidNow=N(document.getElementById('p_paid')?.value);
    if(!mat||qty<=0)return alert('اختر خامة وأدخل الكمية');
    if(!sup)return alert('اختار المورد — الشراء لازم يرتبط بمورد');
    if(unitPrice<0||total<=0)return alert('أدخل سعر وحدة صحيح');
    if(paidNow<0||paidNow>total)return alert('المدفوع الآن لا يمكن أن يكون أكبر من إجمالي الشراء');
    mat.stock=N(mat.stock)+qty;
    db.purchases.push({id:Date.now(),materialId:mat.id,qty,total,unitPrice,paidNow,supplierId:sup.id,date:new Date().toISOString()});
    save();closeModal();toast('تم الشراء — الكمية × سعر الوحدة = الإجمالي');render();
  };

  /* ---------- Model accessory/fixed-per-piece setup ---------- */
  function ensureCostRecipe(x){ if(!Array.isArray(x.costRecipe))x.costRecipe=[]; return x.costRecipe; }
  function costRecipeTotal(x){ return ensureCostRecipe(x).filter(r=>{const m=(db.materials||[]).find(z=>Number(z.id)===Number(r.materialId));return m&&m.kind==='إكسسوار';}).reduce((a,r)=>a+N(r.qtyPerPiece)*N(r.unitPrice),0); }
  window.editModelMaterialCosts=function(id){

    const opts=mats.map(m=>`<option value="${m.id}">${E(m.name)}${m.color?' — '+E(m.color):''}</option>`).join('');
    modal('🧷 تسعير إكسسوارات الموديل',
      `<div class="muted">الإكسسوارات تُحدد هنا لأول مرة وتُحفظ كتكلفة ثابتة/قطعة. لا تُطلب عند بداية كل قصّة. لا تتغير إلا إذا قرر صاحب المصنع تعديلها يدويًا.</div>
       <div id="accRows">${rows||'<div class="empty">لا توجد إكسسوارات مضافة</div>'}</div>
       <div class="inlineadd" style="margin-top:8px"><select id="accNew">${opts}</select><button class="secondary" onclick="addAccessoryCostRow()">+ إكسسوار</button></div>
       <div class="card"><div class="split"><span>إجمالي تكلفة الإكسسوارات/قطعة</span><b id="accGrand">${M(costRecipeTotal(x))}</b></div></div>
       <button style="width:100%" onclick="saveModelMaterialCosts(${id})">حفظ التسعير</button>`);
    setTimeout(refreshAccessoryCost,0);
  };
  window.addAccessoryCostRow=function(){
    const id=N(document.getElementById('accNew')?.value), m=(db.materials||[]).find(z=>Number(z.id)===id), wrap=document.getElementById('accRows');

    wrap.insertAdjacentHTML('beforeend',`<div class="card cost-accessory-row" data-mid="${id}"><div class="split"><b>${E(m.name)}${m.color?' — '+E(m.color):''}</b><button class="secondary small" onclick="this.closest('.cost-accessory-row').remove();refreshAccessoryCost()">حذف</button></div><div class="formrow"><div class="field"><label>الكمية/قطعة</label><input class="acc-qty" type="number" min="0" step="0.001" value="1" oninput="refreshAccessoryCost()"></div><div class="field"><label>سعر الوحدة</label><input class="acc-price" type="number" min="0" step="0.01" value="0" oninput="refreshAccessoryCost()"></div></div><div class="muted">إجمالي/قطعة: <b class="acc-total">0 ج</b></div></div>`);

  /* ---------- Cut numbering + clearer bank ---------- */
  function nextCutNo(modelId){return (db.cuts||[]).filter(c=>Number(c.modelId)===Number(modelId)).reduce((mx,c)=>Math.max(mx,N(c.sequence||c.cutNo)),0)+1;}

    if(amount<=0)return alert('اكتب مبلغ الدفعة'); if(amount>bal)return alert('الدفعة أكبر من الرصيد المستحق');

    db.payments.push({id:Date.now(),customerId:Number(id),amount,saleId,date:new Date().toISOString()});save();closeModal();toast('تم تسجيل دفعة العميل'+(saleId?' وربطها بالفاتورة':''));customerDetail(id);
  };

  /* ---------- Invoice cancellation ---------- */
  window.cancelSale=function(id){
    const s=(db.sales||[]).find(x=>Number(x.id)===Number(id));if(!s||!activeSale(s))return;

    const model=(db.models||[]).find(x=>Number(x.id)===Number(s.modelId));

    modal('⚠️ إلغاء الفاتورة #'+id,`<div class="card"><div class="title">${E(model?.name||'موديل')} — ${N(s.qty)} قطعة</div><div class="muted">قيمة الفاتورة: ${M(s.total)}</div><div class="muted">المحصل المرتبط بالفاتورة: <b>${M(linked)}</b></div></div><div class="field"><label>نوع الإلغاء</label><select id="cancel_type"><option value="full">إلغاء كامل</option><option value="partial">إلغاء جزئي</option></select></div><div class="field"><label>الكمية الملغاة</label><input id="cancel_qty" type="number" min="1" max="${N(s.qty)}" value="${N(s.qty)}"></div><div class="field"><label>المبلغ المحصل الذي سيتم تسويته</label><input id="cancel_paid" type="number" min="0" max="${linked}" step="0.01" value="${linked}"></div><div class="field"><label>طريقة التسوية</label><select id="cancel_settle"><option value="cash">💵 رد نقدي للعميل</option><option value="credit">🧾 رصيد للعميل</option><option value="none">لا يوجد مبلغ محصل</option></select></div><div id="cancel_warn" class="red"></div><button class="finish-cut-button" style="width:100%;margin-top:8px" onclick="saveSaleCancellation(${id})">🔴 تأكيد إلغاء الفاتورة</button>`);
    setTimeout(()=>{const t=document.getElementById('cancel_type'),q=document.getElementById('cancel_qty'),warn=document.getElementById('cancel_warn');function f(){if(q)q.max=N(s.qty);if(warn)warn.textContent=t?.value==='full'&&N(q?.value)!==N(s.qty)?'الإلغاء الكامل يجب أن يشمل كل الكمية':'';}t?.addEventListener('change',f);q?.addEventListener('input',f);f();},0);
  };
  window.saveSaleCancellation=function(id){
    const s=(db.sales||[]).find(x=>Number(x.id)===Number(id));if(!s||!activeSale(s))return;
    const qty=Math.floor(N(document.getElementById('cancel_qty')?.value)),type=document.getElementById('cancel_type')?.value,settle=document.getElementById('cancel_settle')?.value||'none';
    const linked=(db.payments||[]).filter(p=>Number(p.saleId)===Number(id)).reduce((a,p)=>a+N(p.amount),0);let paidToSettle=N(document.getElementById('cancel_paid')?.value);if(paidToSettle>linked)paidToSettle=linked;
    if(qty<=0||qty>N(s.qty))return alert('كمية الإلغاء غير صحيحة'); if(type==='full'&&qty!==N(s.qty))return alert('الإلغاء الكامل لازم يلغي كل الكمية'); if(type==='partial'&&qty===N(s.qty))return alert('لو كل الكمية اتلغت اختار إلغاء كامل');
    const unit=N(s.unitPrice)||(N(s.qty)?N(s.total)/N(s.qty):0); const cancelValue=qty*unit;
    if(paidToSettle>cancelValue)return alert('المبلغ المحصل المراد تسويته أكبر من قيمة الكمية الملغاة');
    const model=(db.models||[]).find(x=>Number(x.id)===Number(s.modelId)); if(model){model.ready=N(model.ready)+qty;model.sold=Math.max(0,N(model.sold)-qty);}

    if(paidToSettle>0){
      const remaining=paidToSettle; let left=remaining;
      (db.payments||[]).filter(p=>Number(p.saleId)===Number(id)&&!p.cancelledSettlement).forEach(p=>{if(left<=0)return;const take=Math.min(N(p.amount),left);p.cancelledSettlement=settle;p.cancelledAmount=take;left-=take;});

  };
  window.customerDetail=function(id){

    const sales=(db.sales||[]).filter(s=>Number(s.customerId)===Number(id));const pays=(db.payments||[]).filter(p=>Number(p.customerId)===Number(id));const rets=(db.returns||[]).filter(r=>Number(r.customerId)===Number(id));const sold=activeSales().filter(s=>Number(s.customerId)===Number(id)).reduce((a,s)=>a+N(s.total),0);const paid=pays.filter(p=>!p.cancelledSettlement).reduce((a,p)=>a+N(p.amount),0);const returned=rets.reduce((a,r)=>a+retValue(r),0);const bal=sold-paid-returned;const credit=(db.customerCredits||[]).filter(x=>Number(x.customerId)===Number(id)).reduce((a,x)=>a+Math.max(0,N(x.amount)-N(x.used)),0);

    document.getElementById('main').innerHTML=`<div class="section"><button class="back secondary small" onclick="show('customers')">رجوع</button><h2>${E(c.name)}</h2></div><div class="card"><div class="grid3"><div class="metric"><span>ليا</span><b>${M(bal)}</b></div><div class="metric"><span>المبيعات النشطة</span><b>${M(sold)}</b></div><div class="metric"><span>الدفعات</span><b>${M(paid)}</b></div></div><div class="muted">رصيد للعميل: ${M(credit)} — المرتجعات: ${M(returned)}</div><div class="actions"><button onclick="customerPay(${c.id})">💵 تسجيل دفعة</button></div></div><div class="card"><div class="title">🧾 الفواتير</div>${inv}</div>`;

<script>

  const sum=(a,f)=> (a||[]).reduce((x,y)=>x+N(typeof f==='function'?f(y):y?.[f]),0);
  const activeSale=s=>s&&s.status!=='cancelled';
  const activeSales=()=>arr('sales').filter(activeSale);

  /* 1) MASTER DATA RESET: clear movements only; preserve names/settings. */
  window.resetDemo=function(){
    if(!confirm('تصفير الحركات والأرقام فقط؟\nسيتم الاحتفاظ بالخامات والموردين والعملاء والموديلات والأسعار والتكلفة.')) return;
    ['purchases','cuts','sales','payments','supplierPayments','returns','expenses','requests','customerCredits','cashRefunds'].forEach(k=>db[k]=[]);
    arr('materials').forEach(m=>{m.stock=0});
    arr('models').forEach(m=>{m.ready=0;m.inProgress=0;m.required=0;m.produced=0;m.sold=0;m.returned=0;});
    save();render();toast('تم التصفير — البيانات الأساسية محفوظة');
  };

  /* 2) PURCHASE: quantity × unit price = total, with immediate payment as a real supplier payment. */
  window.purchase=function(){
    const mats=arr('materials'), sups=arr('suppliers');
    if(!mats.length)return alert('أضف خامة أولًا');
    if(!sups.length)return alert('أضف موردًا أولًا');
    const matOpts=mats.map(x=>`<option value="${x.id}">${E(x.name)}${x.color?' — '+E(x.color):''} — المخزون ${N(x.stock)} ${E(x.unit||'')}</option>`).join('');
    const supOpts=sups.map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join('');
    modal('🛒 شراء خامة',
      `<div class="field"><label>الصنف</label><div class="inlineadd"><div><select id="p_mat">${matOpts}</select></div><button class="secondary" onclick="quickAdd('material')">+ خامة</button></div></div>
       <div class="formrow"><div class="field"><label>الكمية</label><input id="p_qty" type="number" min="0.01" step="0.01" oninput="purchaseCalc()"></div>
       <div class="field"><label>سعر الوحدة</label><input id="p_unitPrice" type="number" min="0" step="0.01" oninput="purchaseCalc()"></div></div>
       <div class="card"><div class="split"><span>إجمالي الشراء</span><b id="p_total_preview">0 ج</b></div><div class="muted">الإجمالي = الكمية × سعر الوحدة</div></div>
       <div class="field"><label>المدفوع الآن</label><input id="p_paid" type="number" min="0" step="0.01" value="0" oninput="purchaseCalc()"></div>
       <div class="card"><div class="split"><span>المتبقي آجل</span><b id="p_due_preview">0 ج</b></div><div class="muted">المدفوع الآن يُسجل كدفعة فعلية للمورد ويخرج من النقدية. الباقي يصبح مستحقًا.</div></div>
       <div class="field"><label>المورد</label><div class="inlineadd"><div><select id="p_sup">${supOpts}</select></div><button class="secondary" onclick="quickAdd('supplier')">+ مورد</button></div></div>
       <button style="width:100%" onclick="savePurchase()">حفظ الشراء</button>`);
    setTimeout(purchaseCalc,0);
  };
  window.purchaseCalc=function(){
    const q=N(document.getElementById('p_qty')?.value),u=N(document.getElementById('p_unitPrice')?.value),paid=N(document.getElementById('p_paid')?.value);
    const total=q*u;
    const t=document.getElementById('p_total_preview'),d=document.getElementById('p_due_preview');
    if(t)t.textContent=M(total);if(d)d.textContent=M(Math.max(0,total-paid));
  };
  window.savePurchase=function(){
    const mat=arr('materials').find(x=>Number(x.id)===N(document.getElementById('p_mat')?.value));
    const sup=arr('suppliers').find(x=>Number(x.id)===N(document.getElementById('p_sup')?.value));
    const qty=N(document.getElementById('p_qty')?.value),unitPrice=N(document.getElementById('p_unitPrice')?.value),total=qty*unitPrice,paidNow=N(document.getElementById('p_paid')?.value);
    if(!mat||qty<=0)return alert('اختر الخامة وأدخل الكمية');
    if(!sup)return alert('اختار المورد');
    if(unitPrice<0||total<=0)return alert('أدخل سعر وحدة صحيح');
    if(paidNow<0||paidNow>total)return alert('المدفوع الآن لا يمكن أن يكون أكبر من إجمالي الشراء');
    mat.stock=N(mat.stock)+qty;
    const id=Date.now();
    arr('purchases').push({id,materialId:mat.id,qty,total,unitPrice,paidNow,supplierId:sup.id,date:new Date().toISOString()});
    // Do NOT create a second supplier-payment record: paidNow is the payment belonging to this purchase.
    save();closeModal();toast('تم الشراء — الكمية × سعر الوحدة = الإجمالي');render();
  };

  function purchasePaid(p){return N(p.paidNow)}
  function purchaseCredit(p){return Math.max(0,N(p.total)-purchasePaid(p))}
  function supplierBought(id){return sum(arr('purchases').filter(p=>Number(p.supplierId)===Number(id)),p=>p.total)}
  function supplierPaidNow(id){return sum(arr('purchases').filter(p=>Number(p.supplierId)===Number(id)),p=>p.paidNow)}
  function supplierLaterPaid(id){return sum(arr('supplierPayments').filter(p=>Number(p.supplierId)===Number(id)),p=>p.amount)}
  function supplierDue(id){return Math.max(0,supplierBought(id)-supplierPaidNow(id)-supplierLaterPaid(id))}

  /* 3) SUPPLIERS: one consistent ledger: purchase total, paid at purchase, later payments, due. */
  window.suppliers=function(m){

  };

  };

  /* 4) ACCESSORIES: fixed per-piece cost, manually editable; included in model cost. */
  function accessoryCost(x){
    return arr('materials').filter(m=>m.kind==='إكسسوار').length
      ? (Array.isArray(x?.costRecipe)?x.costRecipe:[]).reduce((a,r)=>{
          const m=arr('materials').find(z=>Number(z.id)===Number(r.materialId));

        },0) : 0;
  }
  window.retagAccessoryCostPerPiece=accessoryCost;
  const oldFixed=window.retagFixedCostPerPiece;
  window.retagFixedCostPerPiece=function(model){return (typeof oldFixed==='function'?N(oldFixed(model)):N(model?.fixedCostPerPiece))+accessoryCost(model)};
  /* Historical cut snapshots already call retagFixedCostPerPiece at finish, so new cuts capture accessory cost without touching old numbers. */

  /* Robust model recipe add: button works for fabric or accessory and never depends on implicit globals. */
  window.recipeAdd=function(id){
    const x=arr('models').find(z=>Number(z.id)===Number(id));
    const mid=N(document.getElementById('recipeMat')?.value),q=N(document.getElementById('recipeQty')?.value);
    if(!x||!mid||q<=0)return alert('اختر الخامة واكتب استهلاك القطعة');
    x.recipe=Array.isArray(x.recipe)?x.recipe:[];
    const old=x.recipe.find(r=>Number(r.materialId)===mid);
    if(old)old.qty=q;else x.recipe.push({materialId:mid,qty:q});
    save();toast('تم ربط الخامة بالموديل');render();
  };
  window.addAccessoryCostRow=function(){
    const id=N(document.getElementById('accNew')?.value),m=arr('materials').find(z=>Number(z.id)===id),wrap=document.getElementById('accRows');

  };
  window.editModelMaterialCosts=function(id){
    const x=arr('models').find(z=>Number(z.id)===Number(id));if(!x)return;

    const rows=(Array.isArray(x.costRecipe)?x.costRecipe:[]).map(r=>{const m=arr('materials').find(z=>Number(z.id)===Number(r.materialId));if(!m)return '';return `<div class="card cost-accessory-row" data-mid="${r.materialId}"><div class="split"><b>${E(m.name)}${m.color?' — '+E(m.color):''}</b><button class="secondary small" onclick="this.closest('.cost-accessory-row').remove();refreshAccessoryCost()">حذف</button></div><div class="formrow"><div class="field"><label>الكمية/قطعة</label><input class="acc-qty" type="number" min="0" step="0.001" value="${N(r.qtyPerPiece)}" oninput="refreshAccessoryCost()"></div><div class="field"><label>سعر الوحدة</label><input class="acc-price" type="number" min="0" step="0.01" value="${N(r.unitPrice)}" oninput="refreshAccessoryCost()"></div></div><div class="muted">إجمالي/قطعة: <b class="acc-total">${M(N(r.qtyPerPiece)*N(r.unitPrice))}</b></div></div>`;}).join('');

    modal('🧷 تسعير إكسسوارات الموديل',`<div class="muted">دي تكلفة ثابتة للقطعة: بتتحدد أول مرة، ولا تُسأل عند بداية كل قصّة. لو صاحب المصنع غيّرها يدويًا، التغيير يسري على القصّات الجديدة فقط.</div><div id="accRows">${rows||'<div class="empty">لم تتم إضافة إكسسوارات</div>'}</div><div class="inlineadd" style="margin-top:8px"><select id="accNew">${opts}</select><button class="secondary" onclick="addAccessoryCostRow()">+ إكسسوار</button></div><div class="card"><div class="split"><span>إجمالي تكلفة الإكسسوارات/قطعة</span><b id="accGrand">${M(accessoryCost(x))}</b></div></div><button style="width:100%" onclick="saveModelMaterialCosts(${id})">حفظ التسعير</button>`);
    setTimeout(refreshAccessoryCost,0);
  };
  window.refreshAccessoryCost=function(){
    let total=0;document.querySelectorAll('#accRows .cost-accessory-row').forEach(r=>{const t=N(r.querySelector('.acc-qty')?.value)*N(r.querySelector('.acc-price')?.value);total+=t;const e=r.querySelector('.acc-total');if(e)e.textContent=M(t);});const g=document.getElementById('accGrand');if(g)g.textContent=M(total);

  window.saveModelMaterialCosts=function(id){

    x.accessoryCostPerPiece=accessoryCost(x);x.costRecipeUpdatedAt=new Date().toISOString();save();closeModal();toast('تم حفظ تكلفة الإكسسوارات — ثابتة حتى تعديلها يدويًا');render();
  };

  /* 5) CUTS: logical numbering per model and a very visible finish button. */
  function nextSeq(modelId){return arr('cuts').filter(c=>Number(c.modelId)===Number(modelId)).reduce((mx,c)=>Math.max(mx,N(c.sequence||c.cutNo)),0)+1}
  function cutLabel(c){const x=arr('models').find(m=>Number(m.id)===Number(c.modelId));return `${x?.name||'موديل'} — قصّة رقم ${N(c.sequence||c.cutNo)||1}`}
  const baseSaveCut=window.saveCut;
  window.saveCut=function(){

  };
  const baseFinish=window.saveCutFinish;
  window.saveCutFinish=function(id){

    const c=arr('cuts').find(x=>Number(x.id)===Number(id));if(c){c.sequence=N(c.sequence)||nextSeq(c.modelId)-1;c.cutLabel=cutLabel(c);save();}
  };
  const baseCutFinish=window.cutFinish;
  window.cutFinish=function(id){
    baseCutFinish(id);
    setTimeout(()=>{
      const buttons=[...document.querySelectorAll('.modal button')];buttons.forEach(b=>{if(/إنهاء القص/.test(b.textContent||'')){b.className='finish-cut-button';b.textContent='🟢 إنهاء القصّة الآن';}});
    },0);
  };

  /* 6) SALES: same concept as purchases — invoice total + paid now + due. */
  window.sale=function(){
    const cs=arr('customers').map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join(''),ms=arr('models').map(x=>`<option value="${x.id}" data-ready="${N(x.ready)}" data-price="${N(x.price)}">${E(x.name)}</option>`).join('');
    if(!cs)return alert('أضف عميلًا أولًا قبل إصدار الفاتورة');if(!ms)return alert('أضف موديلًا أولًا قبل إصدار الفاتورة');
    modal('🧾 فاتورة',`<div class="field"><label>العميل</label><div class="inlineadd"><div><select id="s_customer">${cs}</select></div><button class="secondary" onclick="closeModal();add('customer')">+ عميل</button></div></div><div class="field"><label>الموديل</label><select id="s_model" onchange="invoiceLive()">${ms}</select></div><div class="grid3"><div class="metric"><span>الجاهز</span><b id="s_ready">0</b></div><div class="metric"><span>السعر الرسمي</span><b id="s_official">غير محدد</b></div><div class="metric"><span>الإجمالي</span><b id="s_total">0 ج</b></div></div><div class="formrow"><div class="field"><label>سعر البيع في الفاتورة</label><input id="s_unitPrice" type="number" min="0.01" step="0.01" placeholder="سعر القطعة" oninput="invoiceLive()"></div><div class="field"><label>الكمية</label><input id="s_qty" type="number" min="1" value="1" oninput="invoiceLive()"></div></div><div class="field"><label>المدفوع الآن</label><input id="s_paid" type="number" min="0" step="0.01" value="0" oninput="invoiceLive()"></div><div class="card"><div class="split"><span>المتبقي آجل</span><b id="s_due">0 ج</b></div><div class="muted">المدفوع الآن يُسجل كدفعة مرتبطة بالفاتورة ويزيد النقدية. الباقي يظهر مستحقًا على العميل.</div></div><div id="s_price_hint" class="muted"></div><div id="s_warn" class="red"></div><button style="width:100%" onclick="saveSale()">حفظ الفاتورة</button>`);invoiceLive();
  };
  window.invoiceLive=function(){
    const o=document.getElementById('s_model')?.options[document.getElementById('s_model')?.selectedIndex],ready=N(o?.dataset.ready),official=N(o?.dataset.price),q=Math.floor(N(document.getElementById('s_qty')?.value));
    const p=document.getElementById('s_unitPrice');if(p&&document.activeElement!==p&&!p.value&&official>0)p.value=official;
    const unit=N(p?.value),total=q*unit,paid=N(document.getElementById('s_paid')?.value);
    const r=document.getElementById('s_ready'),off=document.getElementById('s_official'),tot=document.getElementById('s_total'),due=document.getElementById('s_due');
    if(r)r.textContent=ready;if(off)off.textContent=official>0?M(official):'غير محدد';if(tot)tot.textContent=M(total);if(due)due.textContent=M(Math.max(0,total-paid));
    const hint=document.getElementById('s_price_hint');if(hint)hint.textContent=official>0?'السعر الرسمي مملوء تلقائيًا. تغييره هنا يغيّر هذه الفاتورة فقط.':'الموديل بدون سعر رسمي — اكتب سعر البيع هنا؛ ده لا يغيّر السعر الرسمي تلقائيًا.';
    const warn=document.getElementById('s_warn');if(warn)warn.textContent=q>ready?'⚠️ الكمية أكبر من الجاهز المتاح':(paid>total?'⚠️ المدفوع أكبر من إجمالي الفاتورة':'');
  };
  window.saveSale=function(){
    const x=arr('models').find(z=>Number(z.id)===N(document.getElementById('s_model')?.value)),customerId=N(document.getElementById('s_customer')?.value),q=Math.floor(N(document.getElementById('s_qty')?.value)),unit=N(document.getElementById('s_unitPrice')?.value),paidNow=N(document.getElementById('s_paid')?.value);
    if(!x||!customerId||q<=0)return alert('اختر العميل والموديل والكمية');if(q>x.ready)return alert('لا يمكن بيع أكثر من الجاهز');if(unit<=0)return alert('اكتب سعر البيع للقطعة');const total=q*unit;if(paidNow<0||paidNow>total)return alert('المدفوع الآن لا يمكن أن يكون أكبر من إجمالي الفاتورة');
    x.ready=N(x.ready)-q;x.sold=N(x.sold)+q;x.required=Math.max(0,N(x.required)-q);
    const id=Date.now();arr('sales').push({id,customerId,modelId:x.id,qty:q,unitPrice:unit,total,officialPriceAtSale:N(x.price),paidNow,date:new Date().toISOString()});
    if(paidNow>0)arr('payments').push({id:id+1,customerId,amount:paidNow,saleId:id,date:new Date().toISOString(),source:'invoice'});
    save();closeModal();toast('تم حفظ الفاتورة — المدفوع الآن سُجل على العميل والنقدية');render();
  };

  /* 7) CUSTOMER BALANCE: include invoice-time payments and returns, exclude cancelled settlement payments. */
  function saleUnit(s){return N(s.unitPrice)||(N(s.qty)?N(s.total)/N(s.qty):0)}
  function retVal(r){if(N(r.total)>0)return N(r.total);if(N(r.amount)>0)return N(r.amount);const s=arr('sales').find(x=>Number(x.id)===Number(r.saleId));return s?N(r.qty)*saleUnit(s):0;}
  window.customerBalance=function(id){
    const sold=activeSales().filter(s=>Number(s.customerId)===Number(id)).reduce((a,s)=>a+N(s.total),0);
    const paid=arr('payments').filter(p=>Number(p.customerId)===Number(id)&&!p.cancelledSettlement).reduce((a,p)=>a+N(p.amount),0);
    const returned=arr('returns').filter(r=>Number(r.customerId)===Number(id)).reduce((a,r)=>a+retVal(r),0);
    return sold-paid-returned;
  };
  window.retagCustomerBalance=window.customerBalance;
  window.customers=function(m){
    const rows=arr('customers').map(c=>{const sold=activeSales().filter(s=>Number(s.customerId)===Number(c.id)).reduce((a,s)=>a+N(s.total),0),paid=arr('payments').filter(p=>Number(p.customerId)===Number(c.id)&&!p.cancelledSettlement).reduce((a,p)=>a+N(p.amount),0),ret=arr('returns').filter(r=>Number(r.customerId)===Number(c.id)).reduce((a,r)=>a+retVal(r),0),bal=sold-paid-ret;return `<div class="card" onclick="customerDetail(${c.id})"><div class="split"><div class="title">${E(c.name)}</div><b>${M(bal)}</b></div><div class="muted">مبيعات ${M(sold)} — دفعات ${M(paid)} — مرتجعات ${M(ret)}</div><div class="actions"><button class="secondary small" onclick="event.stopPropagation();customerPay(${c.id})">+ دفعة</button></div></div>`}).join('')||'<div class="card empty">أضف أول عميل</div>';
    m.innerHTML=`<div class="section"><h2>👥 العملاء</h2><button onclick="add('customer')" class="small">+ إضافة عميل</button></div>${rows}`;
  };

  /* 8) ACCOUNTS: purchases paid-now + later supplier payments; sales paid-now + later customer payments. */
  window.accounts=function(m){
    const sales=activeSales().reduce((a,s)=>a+N(s.total),0),collections=arr('payments').filter(p=>!p.cancelledSettlement).reduce((a,p)=>a+N(p.amount),0),returns=arr('returns').reduce((a,r)=>a+retVal(r),0),purchases=arr('purchases').reduce((a,p)=>a+N(p.total),0),purchasePaidNow=arr('purchases').reduce((a,p)=>a+N(p.paidNow),0),supplierLater=supplierPayments=arr('supplierPayments').reduce((a,p)=>a+N(p.amount),0),expenses=arr('expenses').reduce((a,e)=>a+N(e.amount),0),refunds=arr('cashRefunds').reduce((a,r)=>a+N(r.amount),0);
    const supplierDue=Math.max(0,purchases-purchasePaidNow-supplierLater),receivable=sales-collections-returns,netCash=collections-purchasePaidNow-supplierLater-expenses-refunds;
    m.innerHTML=`<div class="section"><h2>💰 الحسابات</h2></div><div class="grid"><div class="card metric"><span>ليا — العملاء</span><b>${M(receivable)}</b></div><div class="card metric"><span>عليا — الموردين</span><b>${M(supplierDue)}</b></div><div class="card metric"><span>المبيعات</span><b>${M(sales)}</b></div><div class="card metric"><span>التحصيل</span><b>${M(collections)}</b></div><div class="card metric"><span>مرتجعات العملاء</span><b>${M(returns)}</b></div><div class="card metric"><span>مصروفات المصنع</span><b>${M(expenses)}</b></div></div><div class="card"><div class="title">💵 صافي حركة النقدية</div><div class="big">${M(netCash)}</div><div class="muted">التحصيل − المدفوع نقدًا في المشتريات − دفعات الموردين − المصروفات − ردود النقد للعملاء.</div></div><div class="card"><div class="title">🧾 المشتريات — مخزون</div><div class="big">${M(purchases)}</div><div class="muted">المشتريات تزيد المخزون؛ لا تُحسب كمصروف تشغيل.</div></div>`;
  };

  /* 9) Invoice cancellation: reverse stock + sales; settle any collected amount as cash refund or customer credit. */
  window.cancelSale=function(id){
    const s=arr('sales').find(x=>Number(x.id)===Number(id));if(!s||!activeSale(s))return;
    const linked=arr('payments').filter(p=>Number(p.saleId)===Number(id)&&!p.cancelledSettlement).reduce((a,p)=>a+N(p.amount),0),model=arr('models').find(x=>Number(x.id)===Number(s.modelId));
    modal('⚠️ إلغاء الفاتورة #'+id,`<div class="card"><div class="title">${E(model?.name||'موديل')} — ${N(s.qty)} قطعة</div><div class="muted">قيمة الفاتورة: ${M(s.total)}</div><div class="muted">المحصل المرتبط بالفاتورة: <b>${M(linked)}</b></div></div><div class="field"><label>نوع الإلغاء</label><select id="cancel_type"><option value="full">إلغاء كامل</option><option value="partial">إلغاء جزئي</option></select></div><div class="field"><label>الكمية الملغاة</label><input id="cancel_qty" type="number" min="1" max="${N(s.qty)}" value="${N(s.qty)}"></div><div class="field"><label>المبلغ المحصل الذي سيتم تسويته</label><input id="cancel_paid" type="number" min="0" max="${linked}" step="0.01" value="${linked}"></div><div class="field"><label>طريقة التسوية</label><select id="cancel_settle"><option value="cash">💵 رد نقدي للعميل</option><option value="credit">🧾 رصيد للعميل</option><option value="none">لا يوجد مبلغ محصل</option></select></div><div id="cancel_warn" class="red"></div><button class="finish-cut-button" style="width:100%;margin-top:8px" onclick="saveSaleCancellation(${id})">🔴 تأكيد إلغاء الفاتورة</button>`);
  };
  window.saveSaleCancellation=function(id){
    const s=arr('sales').find(x=>Number(x.id)===Number(id));if(!s||!activeSale(s))return;
    const type=document.getElementById('cancel_type')?.value||'full',qty=Math.floor(N(document.getElementById('cancel_qty')?.value)),linked=arr('payments').filter(p=>Number(p.saleId)===Number(id)&&!p.cancelledSettlement).reduce((a,p)=>a+N(p.amount),0),settle=document.getElementById('cancel_settle')?.value||'none',requested=N(document.getElementById('cancel_paid')?.value),paidToSettle=Math.min(linked,requested);

    if(type==='partial'){s.qty=N(s.qty)-qty;s.total=N(s.total)-cancelValue;s.cancellationHistory=Array.isArray(s.cancellationHistory)?s.cancellationHistory:[];s.cancellationHistory.push({qty,amount:cancelValue,date:new Date().toISOString(),type:'partial'});}

  save();
})();

<script>

/* RETAG V32.1 — accessory visibility + historical accessory cost snapshot correction */
(function(){
  const N=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
  const E=s=>typeof esc==='function'?esc(s):String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const A=()=>Array.isArray(db.materials)?db.materials:[];
  function accessoryCost(model){return (Array.isArray(model?.costRecipe)?model.costRecipe:[]).reduce((a,r)=>{const m=A().find(z=>Number(z.id)===Number(r.materialId));return a+(m&&m.kind==='إكسسوار'?N(r.qtyPerPiece)*N(r.unitPrice):0)},0)}

    if(!target)return;

    const rows=(Array.isArray(x.costRecipe)?x.costRecipe:[]).map(r=>{const mat=A().find(z=>Number(z.id)===Number(r.materialId));if(!mat||mat.kind!=='إكسسوار')return '';return `<div class="item retag-accessory-list"><div><b>🧷 ${E(mat.name)}${mat.color?' — '+E(mat.color):''}</b><div class="muted">${N(r.qtyPerPiece)} قطعة/قطعة · تكلفة ${M(N(r.qtyPerPiece)*N(r.unitPrice))}/قطعة</div></div><b>ثابت</b></div>`}).join('');

    const c=(db.cuts||[]).find(z=>Number(z.id)===Number(id));if(!c)return;

    const explicitFixed=Array.isArray(model.fixedCosts)&&model.fixedCosts.length?model.fixedCosts.reduce((a,r)=>a+N(r.perPiece),0):N(model.fixedCostPerPiece);
    const acc=accessoryCost(model), fixed=explicitFixed+acc;
    c.fixedCostPerPieceAtCut=fixed;
    if(c.costSnapshot){
