    const totalQty=purchases.reduce((a,p)=>a+N(p.qty),0),totalCost=purchases.reduce((a,p)=>a+N(p.total),0),avg=totalQty?totalCost/totalQty:0;
    const hist=purchases.map(p=>{const sup=(db.suppliers||[]).find(s=>Number(s.id)===Number(p.supplierId));return `<div class="item"><div><b>${new Date(p.date||Date.now()).toLocaleDateString('ar-EG')}</b><div class="muted">${N(p.qty)} ${E(x.unit||'وحدة')} — ${M(p.total)} — ${sup?E(sup.name):'بدون مورد'}</div></div><b>${M(N(p.qty)?N(p.total)/N(p.qty):0)} / ${E(x.unit||'وحدة')}</b></div>`;}).join('')||'<div class="empty">لا توجد حركات شراء لهذه الخامة</div>';
    document.getElementById('main').innerHTML=`<div class="section"><button class="back secondary small" onclick="show('stock')">رجوع</button><h2>${E(x.name)}${x.color?' — '+E(x.color):''}</h2></div><div class="card"><div class="split"><div><div class="muted">الرصيد الحالي</div><div class="big">${N(x.stock)} ${E(x.unit||'وحدة')}</div></div><span class="tag">${N(x.stock)<0?'🔴 نقص':(N(x.stock)>0?'🟢 متاح':'⚪ صفر')}</span></div><div class="actions"><button onclick="purchaseForMaterial(${x.id})">🛒 شراء خامة</button></div></div><div class="grid"><div class="card metric"><span>عدد المشتريات</span><b>${purchases.length}</b></div><div class="card metric"><span>متوسط سعر الوحدة</span><b>${M(avg)}</b></div></div><div class="section"><h2>🧾 حركة الشراء</h2></div><div class="card">${hist}</div>`;
  };

  /* 4) Invoice payment wording: keep the already-tested mechanics, only make the concept unmistakable. */
  const oldSale=window.sale;
  window.sale=function(){
    oldSale();
    setTimeout(()=>{
      const p=document.getElementById('s_paid');
      if(p){const label=p.parentElement?.querySelector('label');if(label)label.textContent='المدفوع الآن من الفاتورة';}
      const due=document.getElementById('s_due');
      if(due){const card=due.closest('.card');const muted=card?.querySelector('.muted');if(muted)muted.textContent='إجمالي الفاتورة − المدفوع الآن = المتبقي آجل. الدفعة مرتبطة بالفاتورة وتدخل التحصيل والنقدية.';}
    },0);
  };
  save();
})();

</script>

<script>

/* RETAG V34 — confirmed fixes only (no change to already-tested business rules)
   1) Supplier due MUST deduct paidNow at purchase + later payments.
   2) Customer-detail invoice cards get the cancellation action too.
   3) Completed cuts remain openable as read-only data; no action buttons.
   4) Repair duplicate/missing cut sequence numbers only when the existing set is invalid.
*/
(function(){
  const N=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
  const E=s=>typeof esc==='function'?esc(s):String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const M=v=>typeof money==='function'?money(N(v)):N(v).toLocaleString('ar-EG')+' ج';
  const arr=k=>Array.isArray(db[k])?db[k]:[];

  // ---- 1. Supplier balance: one source of truth ----
  window.supplierDue=function(id){
    const purchases=arr('purchases').filter(p=>Number(p.supplierId)===Number(id));
    const bought=purchases.reduce((a,p)=>a+N(p.total),0);
    const paidNow=purchases.reduce((a,p)=>a+N(p.paidNow),0);
    const later=arr('supplierPayments').filter(p=>Number(p.supplierId)===Number(id)).reduce((a,p)=>a+N(p.amount),0);
    return Math.max(0,bought-paidNow-later);
  };
  window.suppliers=function(m){
    const rows=arr('suppliers').map(s=>{
      const purchases=arr('purchases').filter(p=>Number(p.supplierId)===Number(s.id));
      const bought=purchases.reduce((a,p)=>a+N(p.total),0);
      const paidNow=purchases.reduce((a,p)=>a+N(p.paidNow),0);
      const later=arr('supplierPayments').filter(p=>Number(p.supplierId)===Number(s.id)).reduce((a,p)=>a+N(p.amount),0);
      const due=Math.max(0,bought-paidNow-later);
      return `<div class="card"><div class="split"><div><div class="title">${E(s.name)}</div><div class="muted">مشتريات ${M(bought)} — مدفوع وقت الشراء ${M(paidNow)} — دفعات لاحقة ${M(later)}</div></div><b>${M(due)}</b></div><div class="muted" style="margin-top:6px">المستحق للمورد: ${M(due)}</div><div class="actions"><button class="secondary small" onclick="supplierPay(${s.id})">+ دفعة</button></div></div>`;
    }).join('')||'<div class="card empty">أضف أول مورد</div>';
    m.innerHTML=`<div class="section"><h2>🚚 الموردين</h2><button onclick="add('supplier')" class="small">+ إضافة مورد</button></div>${rows}`;
  };

  // ---- 2. Cancellation action also visible from customer detail ----
  const oldCustomerDetail=window.customerDetail;
  window.customerDetail=function(id){
    oldCustomerDetail(id);
    setTimeout(()=>{
      const main=document.getElementById('main');
      if(!main)return;
      const cards=[...main.querySelectorAll('.item')];
      cards.forEach(item=>{
        const txt=item.textContent||'';
        const match=txt.match(/فاتورة #([0-9]+)/);
        if(!match)return;
        const sid=Number(match[1]);
        const sale=arr('sales').find(s=>Number(s.id)===sid);
        if(!sale||sale.status==='cancelled')return;
        if(item.querySelector('.v34-cancel-sale'))return;
        const wrap=document.createElement('div');
        wrap.style.marginTop='8px';
        const b=document.createElement('button');
        b.className='secondary small v34-cancel-sale';
        b.textContent='↩️ إلغاء الفاتورة';
        b.onclick=e=>{e.stopPropagation();cancelSale(sid);};
        wrap.appendChild(b);item.appendChild(wrap);
      });
    },0);
  };

  // ---- 3. Repair invalid duplicate/missing cut sequence numbers, preserving valid history ----
  function normalizeCutSequences(){
    const cuts=arr('cuts');
    const byModel={};
    cuts.forEach(c=>{const k=String(c.modelId);(byModel[k]||(byModel[k]=[])).push(c);});
    Object.values(byModel).forEach(list=>{
      const nums=list.map(c=>N(c.sequence||c.cutNo)).filter(n=>n>0);
      const valid=nums.length===list.length && new Set(nums).size===list.length &&
        nums.slice().sort((a,b)=>a-b).every((n,i)=>n===i+1);
      if(valid)return;
      list.sort((a,b)=>String(a.start||a.createdAt||'').localeCompare(String(b.start||b.createdAt||'')) || N(a.id)-N(b.id));
      list.forEach((c,i)=>{c.sequence=i+1;c.cutLabel=cutLabel(c);});
    });
    save();
  }
  normalizeCutSequences();

  save();
})();

</script>

    const m=document.getElementById('main');
    m.innerHTML=`<div class="section"><button class="back secondary small" onclick="show('suppliers')">رجوع</button><h2>🚚 ${E(s.name)}</h2></div>
      <div class="card"><div class="grid3">
        <div class="metric"><span>المشتريات</span><b>${M(bought)}</b></div>
        <div class="metric"><span>مدفوع وقت الشراء</span><b>${M(paidNow)}</b></div>
        <div class="metric"><span>دفعات لاحقة</span><b>${M(laterPaid)}</b></div>
      </div><div class="card" style="margin-top:10px"><div class="split"><span>المستحق للمورد</span><b>${M(due)}</b></div></div>
      <div class="actions"><button onclick="supplierPay(${s.id})">💵 تسجيل دفعة</button></div></div>
      <div class="card"><div class="title">🧾 المشتريات</div>${purchaseRows}</div>
      <div class="card"><div class="title">💵 الدفعات اللاحقة</div>${paymentRows}</div>`;
  };

  // Replace supplier list rendering with clickable cards.
  window.suppliers=function(m){
    const rows=arr('suppliers').map(s=>{
      const purchases=arr('purchases').filter(p=>Number(p.supplierId)===Number(s.id));
      const bought=purchases.reduce((a,p)=>a+N(p.total),0);
      const paidNow=purchases.reduce((a,p)=>a+N(p.paidNow),0);
      const later=arr('supplierPayments').filter(p=>Number(p.supplierId)===Number(s.id)).reduce((a,p)=>a+N(p.amount),0);
      const due=Math.max(0,bought-paidNow-later);
      return `<div class="card v35-supplier-card" style="cursor:pointer" onclick="supplierDetail(${s.id})">
        <div class="split"><div><div class="title">${E(s.name)}</div><div class="muted">مشتريات ${M(bought)} — مدفوع وقت الشراء ${M(paidNow)} — دفعات لاحقة ${M(later)}</div></div><b>${M(due)}</b></div>
        <div class="muted" style="margin-top:6px">المستحق للمورد: ${M(due)}</div>
        <div class="actions"><button class="secondary small" onclick="event.stopPropagation();supplierPay(${s.id})">+ دفعة</button></div>
      </div>`;
    }).join('')||'<div class="card empty">أضف أول مورد</div>';
    m.innerHTML=`<div class="section"><h2>🚚 الموردين</h2><button onclick="add('supplier')" class="small">+ إضافة مورد</button></div>${rows}`;
  };

  save();
})();

</script>
